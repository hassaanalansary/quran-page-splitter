[project]
name = "quran-page-spliter"
version = "0.1.0"
description = "A small web application and CLI tool for processing Mushaf (Quran) pages, intelligently crop the page bounds, automatically detect text lines, classify Sura name decorations, and split lines into individual aya segments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6",
    "fastapi>=0.135.3",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.11.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true
