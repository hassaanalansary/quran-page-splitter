[project]
name = "quran-page-spliter"
version = "0.1.0"
description = "A small web application and CLI tool for processing Mushaf (Quran) pages, intelligently crop the page bounds, automatically detect text lines, classify Sura name decorations, and split lines into individual aya segments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6",
    "django-environ>=0.14.0",
    "django-cors-headers>=4.7.0",
    "django-ninja>=1.6.2",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.11.0",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "django-allauth[headless-spec,socialaccount]>=65.19.1",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "ruff>=0.15.12",
    "django-stubs-ext>=5.2.8",
    "django-stubs[compatible-mypy]==6.0.6",
    "django-watchfiles>=1.4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "core"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated Django migrations: don't hand-format long help_text (E501)
# or fight the framework's class-level mutable lists (RUF012).
"**/migrations/*" = ["E501", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cv2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true

# django-allauth ships no py.typed marker; the django-stubs plugin still pulls
# its models in when resolving the user model's reverse relations.
[[tool.mypy.overrides]]
module = "allauth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["api.tests.*", "accounts.tests"]
disallow_untyped_defs = false
check_untyped_defs = false

# Migrations are generated (or hand-written to match); their RunPython callables
# take the historical-model registry, which has no useful static type.
[[tool.mypy.overrides]]
module = ["api.migrations.*", "accounts.migrations.*"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"
