<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Line Cut Review</title>
  <link rel="stylesheet" href="static/css/base.css" />
  <link rel="stylesheet" href="static/css/components.css" />
  <link rel="stylesheet" href="static/css/review.css" />
  <link rel="stylesheet" href="static/css/cut_review.css" />
  <script type="module" src="static/js/cut_review/main.js"></script>
</head>

<body>
  <header>
    <div class="container review-header">
      <h1>Cut Review</h1>
      <div class="coords" id="cut-status">loading cut data</div>
    </div>
  </header>

  <main class="review-shell cut-review-shell">
    <section class="review-canvas-panel">
      <div class="review-canvas-toolbar">
        <div>
          <div class="preview-label" id="cut-page-title">// Page</div>
          <div class="review-hint" id="cut-line-title">No line selected.</div>
        </div>
        <div id="mode-indicator" class="mode-indicator">
          <span class="mode-badge">RESIZE</span><span class="mode-hint">hold Shift to erase</span>
        </div>
        <div class="review-actions">
          <button id="prev-line-btn">Prev Line</button>
          <button id="next-line-btn">Next Line</button>
          <button id="undo-stroke-btn" disabled>Undo Stroke</button>
        </div>
      </div>
      <div class="review-canvas-wrap cut-canvas-wrap">
        <canvas id="cut-canvas"></canvas>
      </div>
    </section>

    <aside class="review-sidebar">
      <section class="review-panel">
        <div class="panel-head">
          <span>// Pages</span>
          <div class="review-actions">
            <button id="prev-page-btn">Prev</button>
            <button id="next-page-btn">Next</button>
          </div>
        </div>
        <div class="page-strip" id="page-strip"></div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Lines</span>
        </div>
        <div class="line-list cut-line-list" id="line-list"></div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Crop Box</span>
        </div>
        <div class="selection-panel" id="box-panel">
          <p class="empty-state">No line selected.</p>
        </div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Eraser</span>
        </div>
        <div class="field">
          <label for="brush-size">Brush Size</label>
          <input id="brush-size" type="range" min="2" max="80" step="1" value="16" />
        </div>
        <div class="brush-readout" id="brush-readout">16 px</div>
        <div class="review-actions review-actions--wide">
          <button id="clear-line-mask-btn" class="danger">Clear Line Mask</button>
        </div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Sync</span>
        </div>
        <div class="review-actions review-actions--wide">
          <button class="primary" id="save-cut-btn">Save cut JSON</button>
          <button class="primary" id="export-lines-btn">Export line PNGs</button>
          <button id="reload-cut-btn">Reload</button>
        </div>
      </section>
    </aside>
  </main>
</body>

</html>
