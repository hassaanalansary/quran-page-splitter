<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Review Editor</title>
  <link rel="stylesheet" href="static/css/base.css" />
  <link rel="stylesheet" href="static/css/components.css" />
  <link rel="stylesheet" href="static/css/review.css" />
  <script type="module" src="static/js/review/main.js"></script>
</head>

<body>
  <header>
    <div class="container review-header">
      <h1>✧ REVIEW EDITOR</h1>
      <div class="coords" id="review-status">loading review data</div>
    </div>
  </header>

  <main class="review-shell">
    <section class="review-canvas-panel">
      <div class="review-canvas-toolbar">
        <div>
          <div class="preview-label" id="page-title">// Page</div>
          <div class="review-hint" id="canvas-hint">Select a line or segment to edit.</div>
        </div>
        <div class="review-actions">
          <button id="fit-btn">Fit</button>
          <button id="undo-btn" disabled>Undo</button>
          <button id="redo-btn" disabled>Redo</button>
        </div>
      </div>
      <div class="review-canvas-wrap">
        <canvas id="review-canvas"></canvas>
      </div>
    </section>

    <aside class="review-sidebar">
      <section class="review-panel">
        <div class="panel-head">
          <span>// Pages</span>
          <div class="review-actions">
            <button id="prev-page-btn">Prev</button>
            <button id="next-page-btn">Next</button>
          </div>
        </div>
        <div class="page-strip" id="page-strip"></div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Lines</span>
        </div>
        <div class="line-list" id="line-list"></div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Selection</span>
        </div>
        <div class="selection-panel" id="selection-panel">
          <p class="empty-state">No line selected.</p>
        </div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Validation</span>
          <label class="compact-check">
            <input type="checkbox" id="validation-toggle" />
            Enable
          </label>
        </div>
        <input type="file" id="metadata-file" accept="application/json" />
        <div class="warning-list" id="validation-panel"></div>
      </section>

      <section class="review-panel">
        <div class="panel-head">
          <span>// Sync</span>
        </div>
        <label class="compact-check">
          <input type="checkbox" id="reexport-images" />
          Re-export corrected images
        </label>
        <div class="review-actions review-actions--wide">
          <button class="primary" id="save-review-btn">Save corrected JSON</button>
          <button id="reload-original-btn">Reload original</button>
        </div>
      </section>
    </aside>
  </main>
</body>

</html>
