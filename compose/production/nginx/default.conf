server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Where Django answers. The address sits in a variable on purpose: nginx then
  # asks Docker's DNS server (127.0.0.11) for the django container's address while
  # it runs, at most every 5 seconds. Written as a plain `upstream` block, nginx
  # would look the name up once, at its own start, and keep sending requests to the
  # old address after a deploy replaced the django container: 502 on every API
  # call until nginx itself was restarted.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $django http://django:5000;

  # The largest request body nginx lets through. The app sets no limit of its own
  # on a mushaf PDF or a work bundle, so this is the only one. A scanned mushaf of
  # 600 pages can pass half a gigabyte.
  client_max_body_size 2g;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript application/json text/css image/svg+xml;

  # Django: the API, the admin and its static files, allauth's JSON API and the
  # OAuth callbacks. Traefik sets X-Forwarded-For and X-Forwarded-Proto, and they
  # are handed on unchanged.
  location ~ ^/(api|admin|static|_allauth|accounts)/ {
    proxy_pass $django;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Exports and bundles are streamed and can take minutes.
    proxy_read_timeout 300s;
  }

  # Uploads, template crops and exported images. They are public today (Django
  # serves them without a login), so nginx serves them straight from the volume.
  location /media/ {
    alias /usr/share/nginx/media/;
  }

  # Hashed build assets never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Every other path is a page of the React app.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
}
